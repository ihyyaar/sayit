<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#F8F8F8" />
<title>floorum</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; background: #F8F8F8;
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  .thought { font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif; }
  button { font-family: inherit; cursor: pointer; }
  textarea, input, select { font-family: inherit; }
  .focusable:focus-visible { outline: 2px solid #4688EC; outline-offset: 2px; }
  @keyframes pulseSoft { 0%,100% { opacity: 1 } 50% { opacity: .45 } }
  @keyframes spin { to { transform: rotate(360deg) } }
  .livedot { animation: pulseSoft 1.8s ease-in-out infinite; }
  .spinner { animation: spin .8s linear infinite; }
  .split { display: grid; grid-template-columns: 360px 1fr; gap: 20px; align-items: start; }
  .split-even { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: start; }
  @media (max-width: 900px) { .split, .split-even { grid-template-columns: 1fr; } }
  .sayit-shell { height: 100vh; }
  @supports (height: 100dvh) { .sayit-shell { height: 100dvh; } }
  .fl-scroll { scrollbar-width: thin; scrollbar-color: var(--fl-scroll, #ACACAC) transparent; }
  .fl-scroll::-webkit-scrollbar { width: 6px; }
  .fl-scroll::-webkit-scrollbar-thumb { background: var(--fl-scroll, #ACACAC); border-radius: 6px; }
  .fl-scroll::-webkit-scrollbar-track { background: transparent; }
  .fl-q .fl-tools { opacity: 0; pointer-events: none; transition: opacity 120ms ease; }
  .fl-q .fl-tools:focus-within, .fl-q .fl-confirming { opacity: 1; pointer-events: auto; }
  .fl-q:hover .fl-tools, .fl-q:focus-within .fl-tools { opacity: 1; pointer-events: auto; }
  @media (hover: none), (pointer: coarse) { .fl-q .fl-tools { opacity: 1; pointer-events: auto; } }
  /* Hover, pointer devices only (touch never depends on it): a light tint laid
     over whatever the control's own background is, so filled and transparent
     controls respond alike; underline tabs darken their label instead. */
  /* Sliding notifications: slide in, sit ~6s, slide out. Never block the page. */
  @keyframes fl-in-x { from { transform: translateX(32px); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes fl-out-x { to { transform: translateX(32px); opacity: 0; } }
  @keyframes fl-in-y { from { transform: translateY(-24px); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes fl-out-y { to { transform: translateY(-24px); opacity: 0; } }
  .fl-notices { position: fixed; z-index: 50; display: grid; gap: 8px; pointer-events: none; }
  .fl-notice { pointer-events: auto; animation: var(--fl-in, fl-in-x) 220ms ease-out both; }
  .fl-notice.fl-leaving { animation: var(--fl-out, fl-out-x) 220ms ease-in both; }
  @keyframes fl-in-up { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes fl-out-up { to { transform: translateY(24px); opacity: 0; } }
  @keyframes fl-count { from { transform: scaleX(1); } to { transform: scaleX(0); } }
  /* Topic check: beside the class column on wide screens, above the bottom
     edge on phones. Never covers the composer's top area; never blocks. */
  .fl-ask-wrap { position: fixed; z-index: 50; left: 12px; right: 12px; bottom: 12px; display: flex; justify-content: center; pointer-events: none; --fl-in: fl-in-up; --fl-out: fl-out-up; }
  .fl-ask-wrap > * { width: 100%; max-width: 420px; }
  @media (min-width: 900px) { .fl-ask-wrap { left: auto; bottom: auto; right: 24px; top: 88px; width: 300px; --fl-in: fl-in-x; --fl-out: fl-out-x; } }
  @media (prefers-reduced-motion: reduce) { .fl-notice, .fl-notice.fl-leaving { animation: none; } .fl-count { animation: none !important; } }
  @media (hover: hover) and (pointer: fine) {
    button:not(:disabled), select:not(:disabled), a[href] { cursor: pointer; }
    button:disabled { cursor: default; }
    button, a[href] { transition: box-shadow 120ms ease, border-color 120ms ease, color 120ms ease, filter 120ms ease; }
    /* buttons and icon buttons: a clearly darker fill plus a firm inner edge;
       drawn inside the box, so the hit area and layout never change */
    button:not(:disabled):hover, a[href]:hover { box-shadow: inset 0 0 0 1.5px var(--fl-hover-ring, rgba(0,0,0,.55)), inset 0 0 0 999px var(--fl-hover, rgba(0,0,0,.1)); }
    /* text-style buttons: full ink and a heavy underline instead of a box */
    .fl-link:not(:disabled):hover { box-shadow: none; color: var(--fl-ink, #000) !important; text-decoration: underline !important; text-decoration-thickness: 2px !important; text-underline-offset: 3px; }
    /* underline tabs: tint + dark grey underline; the selected tab keeps its blue */
    [role="tab"]:not(:disabled):hover { box-shadow: inset 0 0 0 999px var(--fl-hover, rgba(0,0,0,.1)); }
    [role="tab"][aria-selected="false"]:hover { color: var(--fl-ink, #000) !important; border-bottom-color: var(--fl-hover-line, #6B6E76) !important; }
    /* card-shaped buttons: a dark 2px edge and a darker header block */
    .fl-cardbtn:not(:disabled):hover { box-shadow: 0 0 0 1px var(--fl-ink, #000); border-color: var(--fl-ink, #000) !important; }
    .fl-cardbtn:not(:disabled):hover > div:first-child { filter: var(--fl-hover-filter, brightness(.88)); }
    /* your own question cards (edit / delete / circle): the card edge darkens */
    .fl-q:hover .fl-own { border-color: var(--fl-ink, #000) !important; box-shadow: 0 0 0 1px var(--fl-ink, #000); }
  }
  #boot { max-width: 520px; margin: 60px auto; padding: 24px; background: #fff;
    border: 1px solid #DDDEE1; border-radius: 12px; line-height: 1.6; color: #505258; font-size: 14px; }
</style>
</head>
<body>
<div id="root"></div>
<div id="boot">
  <b style="color:#292A2E;font-size:16px">Starting…</b>
  <div id="bootmsg" style="margin-top:6px">If this stays put, the message will appear here.</div>
</div>
<script>
window.addEventListener("error", function (e) {
  var b = document.getElementById("bootmsg");
  if (b) b.innerHTML = '<b style="color:#C9372C">' + (e.message || "Something went wrong") + '</b>';
});
</script>
